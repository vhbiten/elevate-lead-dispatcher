# Ambiente de desenvolvimento e avaliação: os valores abaixo são só para uso local.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: elevate
      POSTGRES_PASSWORD: elevate
      POSTGRES_DB: elevate
    ports:
      - "5432:5432"
    volumes:
      # No Postgres 18 o volume vai em /var/lib/postgresql (e não mais em .../data).
      - db-data:/var/lib/postgresql
      - ./backend/prisma/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elevate -d elevate"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend
    # O tini (init) repassa o sinal de parada ao Node, que assim encerra na hora.
    init: true
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://elevate:elevate@db:5432/elevate
      JWT_SECRET: dev-only-jwt-secret-troque-em-producao
      # O painel chega pelo nginx: o IP real do cliente vem no X-Forwarded-For (1 proxy na frente).
      TRUST_PROXY: 1
      # Usado só pelos testes de integração (npm test dentro do container).
      TEST_DATABASE_URL: postgresql://elevate:elevate@db:5432/elevate_test
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    # O painel e a API na mesma origem: http://localhost:8080 serve o front e repassa /api para o backend.
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db-data:
