server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # A API fica na mesma origem do painel: o cookie SameSite=Strict funciona e não há CORS.
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    # O backend usa o IP real do cliente nos limites de requisição (TRUST_PROXY).
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Arquivos do build têm hash no nome: podem ficar em cache por muito tempo.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
